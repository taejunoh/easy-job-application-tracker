services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_DB: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Run npm run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Run npm run setup first}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Run npm run setup first}
      APP_BASE_URL: ${APP_BASE_URL:?Run npm run setup first}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Run npm run setup first}
      LOCAL_DOCKER_HTTP_ENABLED: "1"
      APPLICATION_WRITES_ENABLED: "1"
      APPLICATION_IDENTITY_WRITES_ENABLED: "0"
      VALIDATION_MANUAL_ENTRY_ENABLED: "0"
    ports:
      - "127.0.0.1:${JOBTRACKER_PORT:?Run npm run setup first}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/connect').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
volumes:
  database:
