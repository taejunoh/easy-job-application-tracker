name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobtracker:jobtracker@127.0.0.1:5432/jobtracker_ci
      ENCRYPTION_SECRET: ci-encryption-secret-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      APP_ACCESS_TOKEN: ci-access-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      APP_BASE_URL: https://jobtracker.test
      CORS_ALLOWED_ORIGINS: https://jobtracker.test,chrome-extension://abcdefghijklmnopabcdefghijklmnop
      RUN_DATABASE_INTEGRATION: "1"
      ALLOW_DESTRUCTIVE_DATABASE_TESTS: jobtracker-ci-delete-all

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify database schema matches Prisma schema
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Check extension assets
        run: npm run check:extension

      - name: Run unit and database integration tests
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production application
        run: npm run build
