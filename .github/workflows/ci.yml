name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobtracker:jobtracker@127.0.0.1:5432/jobtracker_ci
      ENCRYPTION_SECRET: ci-encryption-secret-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      APP_ACCESS_TOKEN: ci-access-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      APP_BASE_URL: https://jobtracker.test
      CORS_ALLOWED_ORIGINS: https://jobtracker.test,chrome-extension://abcdefghijklmnopabcdefghijklmnop
      RUN_DATABASE_INTEGRATION: "1"
      ALLOW_DESTRUCTIVE_DATABASE_TESTS: jobtracker-ci-delete-all

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Capture PostgreSQL service address
        env:
          POSTGRES_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          address="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_SERVICE_CONTAINER_ID")"
          printf 'EXPECTED_DATABASE_SERVER_ADDRESS=%s\n' "$address" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency audit policy
        run: npm run check:audit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify database schema matches Prisma schema
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Check extension assets
        run: npm run check:extension

      - name: Run unit and database integration tests
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Verify invalid deployment fails before ready
        run: npm run check:startup-env

  extension-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # 17.10-alpine3.24
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker_extension_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_extension_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobtracker:jobtracker@127.0.0.1:5432/jobtracker_extension_e2e_test
      ENCRYPTION_SECRET: extension-e2e-encryption-secret-cccccccccccc
      APP_ACCESS_TOKEN: extension-e2e-access-token-aaaaaaaaaaaaaaaa
      APP_BASE_URL: https://127.0.0.1:3100
      CORS_ALLOWED_ORIGINS: https://127.0.0.1:3100,chrome-extension://abcdefghijklmnopabcdefghijklmnop
      RUN_EXTENSION_E2E: "1"
      ALLOW_DESTRUCTIVE_EXTENSION_E2E: jobtracker-extension-e2e-delete-all

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Capture PostgreSQL service address
        env:
          POSTGRES_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          address="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_SERVICE_CONTAINER_ID")"
          printf 'EXPECTED_DATABASE_SERVER_ADDRESS=%s\n' "$address" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install bundled Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run extension end-to-end journeys
        run: npm run test:extension:e2e

      - name: Upload sanitized extension diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-e2e-diagnostics
          path: .artifacts/extension-e2e/
          if-no-files-found: ignore
          retention-days: 7

  backup-interruption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PG17_IMAGE: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull digest-pinned PostgreSQL 17 image
        run: docker pull "$PG17_IMAGE"

      - name: Run PostgreSQL 17 backup interruption proof
        run: npm run test:backup:docker
