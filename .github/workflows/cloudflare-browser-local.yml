name: Deploy browser-local to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "browser-local/**"
      - "src/browser-local/**"
      - "src/lib/application-calendar.ts"
      - "src/lib/keyword-matcher.ts"
      - "src/app/fonts/IBM-Plex-Sans-LICENSE.txt"
      - ".github/workflows/cloudflare-browser-local.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-browser-local-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: browser-local/package-lock.json

      - name: Install browser-local dependencies
        working-directory: browser-local
        run: npm ci

      - name: Test browser-local
        working-directory: browser-local
        run: npm test

      - name: Build browser-local
        working-directory: browser-local
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
          command: pages deploy browser-local/dist --project-name=easy-job-application-tracker --branch=main
